openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CyberShield 网络攻防平台 API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard summary
  - name: alerts
    description: Security alerts and threats
  - name: firewall
    description: Firewall rules management
  - name: connections
    description: Network connections monitoring
  - name: scans
    description: Vulnerability scans
  - name: logs
    description: Security audit logs
  - name: traffic
    description: Network traffic analysis

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      description: Returns overall security status and key metrics
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /alerts:
    get:
      operationId: getAlerts
      tags: [alerts]
      summary: List security alerts
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, resolved, all]
        - name: severity
          in: query
          schema:
            type: string
            enum: [critical, high, medium, low]
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of security alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"
    post:
      operationId: createAlert
      tags: [alerts]
      summary: Create a security alert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertInput"
      responses:
        "201":
          description: Created alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"

  /alerts/{id}/resolve:
    post:
      operationId: resolveAlert
      tags: [alerts]
      summary: Resolve a security alert
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resolved alert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Alert"
        "404":
          description: Alert not found

  /alerts/recent:
    get:
      operationId: getRecentAlerts
      tags: [alerts]
      summary: Get recent alerts (last 24h)
      responses:
        "200":
          description: Recent alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Alert"

  /firewall/rules:
    get:
      operationId: getFirewallRules
      tags: [firewall]
      summary: List firewall rules
      responses:
        "200":
          description: List of firewall rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FirewallRule"
    post:
      operationId: createFirewallRule
      tags: [firewall]
      summary: Create a firewall rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirewallRuleInput"
      responses:
        "201":
          description: Created rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirewallRule"

  /firewall/rules/{id}:
    patch:
      operationId: updateFirewallRule
      tags: [firewall]
      summary: Update a firewall rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FirewallRuleUpdate"
      responses:
        "200":
          description: Updated rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirewallRule"
        "404":
          description: Rule not found
    delete:
      operationId: deleteFirewallRule
      tags: [firewall]
      summary: Delete a firewall rule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /connections:
    get:
      operationId: getConnections
      tags: [connections]
      summary: List monitored network connections
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, blocked, suspicious, all]
      responses:
        "200":
          description: List of connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NetworkConnection"

  /connections/{id}/block:
    post:
      operationId: blockConnection
      tags: [connections]
      summary: Block a network connection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Blocked connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkConnection"
        "404":
          description: Connection not found

  /scans:
    get:
      operationId: getScans
      tags: [scans]
      summary: List vulnerability scans
      responses:
        "200":
          description: List of scans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scan"
    post:
      operationId: startScan
      tags: [scans]
      summary: Start a new vulnerability scan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanInput"
      responses:
        "201":
          description: Scan started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"

  /logs:
    get:
      operationId: getLogs
      tags: [logs]
      summary: List security audit logs
      parameters:
        - name: level
          in: query
          schema:
            type: string
            enum: [info, warning, error, critical]
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SecurityLog"

  /traffic/stats:
    get:
      operationId: getTrafficStats
      tags: [traffic]
      summary: Get network traffic statistics (last 24h by hour)
      responses:
        "200":
          description: Traffic stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrafficStat"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DashboardSummary:
      type: object
      required:
        - totalAlerts
        - activeThreats
        - blockedConnections
        - firewallRules
        - lastScanAt
        - securityScore
        - criticalAlerts
        - resolvedToday
      properties:
        totalAlerts:
          type: integer
        activeThreats:
          type: integer
        blockedConnections:
          type: integer
        firewallRules:
          type: integer
        lastScanAt:
          type: ["string", "null"]
        securityScore:
          type: integer
          description: Security score 0-100
        criticalAlerts:
          type: integer
        resolvedToday:
          type: integer

    Alert:
      type: object
      required:
        - id
        - title
        - description
        - severity
        - type
        - sourceIp
        - status
        - detectedAt
        - resolvedAt
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low]
        type:
          type: string
          enum: [intrusion, ddos, malware, brute_force, port_scan, sql_injection, xss, other]
        sourceIp:
          type: string
        targetPort:
          type: ["integer", "null"]
        status:
          type: string
          enum: [active, resolved]
        detectedAt:
          type: string
        resolvedAt:
          type: ["string", "null"]

    AlertInput:
      type: object
      required:
        - title
        - description
        - severity
        - type
        - sourceIp
      properties:
        title:
          type: string
        description:
          type: string
        severity:
          type: string
          enum: [critical, high, medium, low]
        type:
          type: string
          enum: [intrusion, ddos, malware, brute_force, port_scan, sql_injection, xss, other]
        sourceIp:
          type: string
        targetPort:
          type: ["integer", "null"]

    FirewallRule:
      type: object
      required:
        - id
        - name
        - action
        - protocol
        - sourceIp
        - destinationPort
        - enabled
        - priority
        - createdAt
        - description
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        action:
          type: string
          enum: [allow, deny, drop, log]
        protocol:
          type: string
          enum: [tcp, udp, icmp, any]
        sourceIp:
          type: string
          description: CIDR notation or specific IP, * for any
        destinationPort:
          type: string
          description: Port number, range, or * for any
        enabled:
          type: boolean
        priority:
          type: integer
        createdAt:
          type: string

    FirewallRuleInput:
      type: object
      required:
        - name
        - action
        - protocol
        - sourceIp
        - destinationPort
      properties:
        name:
          type: string
        description:
          type: string
        action:
          type: string
          enum: [allow, deny, drop, log]
        protocol:
          type: string
          enum: [tcp, udp, icmp, any]
        sourceIp:
          type: string
        destinationPort:
          type: string
        enabled:
          type: boolean
        priority:
          type: integer

    FirewallRuleUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        action:
          type: string
          enum: [allow, deny, drop, log]
        protocol:
          type: string
          enum: [tcp, udp, icmp, any]
        sourceIp:
          type: string
        destinationPort:
          type: string
        enabled:
          type: boolean
        priority:
          type: integer

    NetworkConnection:
      type: object
      required:
        - id
        - sourceIp
        - sourcePort
        - destinationIp
        - destinationPort
        - protocol
        - status
        - bytesIn
        - bytesOut
        - country
        - connectedAt
      properties:
        id:
          type: integer
        sourceIp:
          type: string
        sourcePort:
          type: integer
        destinationIp:
          type: string
        destinationPort:
          type: integer
        protocol:
          type: string
          enum: [tcp, udp, icmp]
        status:
          type: string
          enum: [active, blocked, suspicious]
        bytesIn:
          type: integer
        bytesOut:
          type: integer
        country:
          type: string
        connectedAt:
          type: string

    Scan:
      type: object
      required:
        - id
        - target
        - type
        - status
        - startedAt
        - completedAt
        - vulnerabilities
        - criticalCount
        - highCount
        - mediumCount
        - lowCount
      properties:
        id:
          type: integer
        target:
          type: string
        type:
          type: string
          enum: [port, vulnerability, full]
        status:
          type: string
          enum: [running, completed, failed]
        startedAt:
          type: string
        completedAt:
          type: ["string", "null"]
        vulnerabilities:
          type: integer
        criticalCount:
          type: integer
        highCount:
          type: integer
        mediumCount:
          type: integer
        lowCount:
          type: integer

    ScanInput:
      type: object
      required:
        - target
        - type
      properties:
        target:
          type: string
        type:
          type: string
          enum: [port, vulnerability, full]

    SecurityLog:
      type: object
      required:
        - id
        - level
        - message
        - source
        - timestamp
        - details
      properties:
        id:
          type: integer
        level:
          type: string
          enum: [info, warning, error, critical]
        message:
          type: string
        source:
          type: string
        timestamp:
          type: string
        details:
          type: ["string", "null"]

    TrafficStat:
      type: object
      required:
        - hour
        - inbound
        - outbound
        - blocked
        - suspicious
      properties:
        hour:
          type: string
        inbound:
          type: integer
        outbound:
          type: integer
        blocked:
          type: integer
        suspicious:
          type: integer
